{% extends 'livros/base.html' %}
{% block title %}
    Excluir livro
{% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-danger">
                    Excluir Livro
                </h1>

                <p class="card-text">
                    Tem certeza que deseja excluir o livro:
                    <strong>{{ livro.titulo }}</strong>?
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Sim, excluir
                    </button>

                    <a href="{% url 'lista_livros' %}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
