{% extends 'livros/base.html' %}

{% block title %}
    Detalhes do livro
{% endblock %}

 {% block content %}
    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">
                    {{ livro.titulo }}
                </h1>

                <p class="card-text">
                    <strong>Autor:</strong> {{ livro.autor }}
                </p>

                <p class="card-text">
                    <strong>Ano de publicação:</strong> {{ livro.ano_publicacao }}
                </p>


                <a href="{% url 'lista_livros' %}" class="btn btn-secondary">
                    Voltar para a lista
                </a>

                <a href="{% url 'editar_livro' livro.id %}" class="btn btn-warning">
                    Editar
                </a>
            </div>

        </div>
    </div>
{% endblock %}
