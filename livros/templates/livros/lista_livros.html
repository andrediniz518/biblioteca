<!DOCTYPE html>
<html>
<head>
    <title>Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">
    <h1 class="mb-4">Sistema de Gerenciamento de Biblioteca</h1>
    <a href="{% url 'cadastrar_livro' %}" class="btn btn-success mb-4">
        Cadastrar Livro
    </a>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% for livro in livros %}
        <div class="card mb-3">
            <div class="card-body">
                <a href="{% url 'detalhe_livro' livro.id %}">
                    <h2 class="card-title">
                        {{ livro.titulo }}
                    </h2>
                </a>
                <p class="card-text">
                    Autor: {{ livro.autor }}
                </p>
                <p class="card-text">
                    Ano: {{ livro.ano_publicacao }}
                </p>
                <a href="{% url 'editar_livro' livro.id %}" 
                   class="btn btn-warning">
                    Editar
                </a>
                <a href="{% url 'excluir_livro' livro.id %}" 
                   class="btn btn-danger">
                    Excluir
                </a>
            </div>
        </div>
    {% endfor %}
</div>

</body>
</html>
