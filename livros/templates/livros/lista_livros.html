<!DOCTYPE html>
<html>
<head>
    <title>Biblioteca</title>
</head>
<body>

    <h1>Sistema de Gerenciamento Biblioteca</h1>

    <a href="{% url 'cadastrar_livro' %}">
    Cadastrar Livro
    </a>
    {% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    {% endif %}
    {% for livro in livros %}
        <a href="{% url 'detalhe_livro' livro.id %}">
        <h2>{{ livro.titulo }}</h2>
        </a>
        <p>Autor: {{ livro.autor }}</p>
        <p>Ano: {{ livro.ano_publicacao }}</p>
        <a href="{% url 'editar_livro' livro.id %}">
        Editar  
        </a>
        <a href="{% url 'excluir_livro' livro.id %}">
        Excluir
        </a>
        <hr>
    {% endfor %}

</body>
</html>
